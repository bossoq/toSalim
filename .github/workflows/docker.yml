name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # repo is toSalim but the published image is tosalim-backend (hardcoded)
  IMAGE_NAME: bossoq/tosalim-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend/python
          file: ./backend/python/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Portainer (GitOps)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          repository: bossoq/homelab-portainer-deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
      - name: Bump pinned image tag + push
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          sed -i -E "s#(ghcr\.io/bossoq/tosalim-backend):[^\"[:space:]]+#\1:${TAG}#g" tosalim/docker-compose.yml
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "no change"; else
            git commit -am "tosalim: deploy ${TAG}"
            git push
          fi
      - name: Trigger Portainer redeploy (via Cloudflare Access)
        run: |
          sleep 5
          curl -fsS -X POST \
            -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}" \
            -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}" \
            "https://portainer.picturo.us/api/stacks/webhooks/2bc4dce6-0c70-44fd-bf3e-50a4da914c01"
